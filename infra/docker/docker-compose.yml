# Local infrastructure for support-triage-ai.
# All values come from the root .env. Run from the repo root:
#   pnpm infra:up      (= docker compose --env-file .env -f infra/docker/docker-compose.yml up -d)
# Default services: MinIO. The app database is a PostgreSQL installed on the host (DATABASE_URL);
# observability uses Langfuse Cloud.
# Optional profiles:
#   pnpm infra:up:postgres-local   Postgres + pgvector in Docker (for machines without a local Postgres;
#                                  set POSTGRES_PORT to a free port and point DATABASE_URL at it)
#   pnpm infra:up:langfuse-local   self-hosted Langfuse
#
# Optional: SigNoz (OpenTelemetry backend) is not included here. To use it, run SigNoz's own
# compose stack and point OTEL_EXPORTER_OTLP_ENDPOINT at its collector.

name: support-triage-ai

services:
  # --- App database in Docker: OPT-IN (profile postgres-local) ---
  # Off by default because this machine uses a host-installed PostgreSQL. If both listen on the
  # same port, the host one silently receives the connections.
  postgres:
    profiles: ['postgres-local']
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Self-hosted Langfuse (v3) and its dependencies: OPT-IN ---
  # The project uses Langfuse Cloud by default (LANGFUSE_HOST in .env). These services only
  # start with the `langfuse-local` profile:  pnpm infra:up:langfuse-local
  # To switch to it, set LANGFUSE_HOST=http://localhost:3002 and use keys from the local UI.
  langfuse-db:
    profiles: ['langfuse-local']
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LANGFUSE_POSTGRES_USER:?set LANGFUSE_POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${LANGFUSE_POSTGRES_PASSWORD:?set LANGFUSE_POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${LANGFUSE_POSTGRES_DB:?set LANGFUSE_POSTGRES_DB in .env}
    volumes:
      - langfuse_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    profiles: ['langfuse-local']
    image: clickhouse/clickhouse-server:24.8
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER in .env}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - clickhouse_logs:/var/log/clickhouse-server
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ['langfuse-local']
    image: redis:7
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}']
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Object storage: MinIO (S3-compatible) ---
  # Pinned to MinIO RELEASE.2025-04-22T22-12-26Z, the last community release with the full
  # admin console. MinIO no longer publishes images (minio/minio and quay.io/minio are gone),
  # so this uses Bitnami's frozen archive build of that release. It receives no security updates:
  # local development only.
  minio:
    image: bitnamilegacy/minio:2025.4.22
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      MINIO_API_PORT_NUMBER: '9000'
      MINIO_CONSOLE_PORT_NUMBER: '9001'
      MINIO_SERVER_URL: ${MINIO_ENDPOINT:?set MINIO_ENDPOINT in .env}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:?set MINIO_CONSOLE_URL in .env}
      MINIO_REGION: ${MINIO_REGION:?set MINIO_REGION in .env}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot setup: buckets, public read policy, app user + scoped policy. Safe to re-run.
  minio-init:
    image: bitnamilegacy/minio:2025.4.22
    restart: 'no'
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ['/bin/sh', '/init/minio-init.sh']
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_LANGFUSE_BUCKET: ${MINIO_LANGFUSE_BUCKET:?set MINIO_LANGFUSE_BUCKET in .env}
      MINIO_PUBLIC_BUCKET: ${MINIO_PUBLIC_BUCKET:?set MINIO_PUBLIC_BUCKET in .env}
      MINIO_APP_POLICY: ${MINIO_APP_POLICY:?set MINIO_APP_POLICY in .env}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?set MINIO_APP_ACCESS_KEY in .env}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?set MINIO_APP_SECRET_KEY in .env}
    volumes:
      - ./minio/minio-init.sh:/init/minio-init.sh:ro

  langfuse-worker:
    profiles: ['langfuse-local']
    image: langfuse/langfuse-worker:3
    restart: unless-stopped
    depends_on: &langfuse-depends-on
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment: &langfuse-env
      DATABASE_URL: postgresql://${LANGFUSE_POSTGRES_USER}:${LANGFUSE_POSTGRES_PASSWORD}@langfuse-db:5432/${LANGFUSE_POSTGRES_DB}
      SALT: ${LANGFUSE_SALT:?set LANGFUSE_SALT in .env}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?set LANGFUSE_ENCRYPTION_KEY in .env}
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      # Langfuse uses the scoped app user, not the MinIO root account.
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: ${MINIO_LANGFUSE_BUCKET}
      LANGFUSE_S3_EVENT_UPLOAD_REGION: ${MINIO_REGION}
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_AUTH: ${REDIS_PASSWORD}

  langfuse-web:
    profiles: ['langfuse-local']
    image: langfuse/langfuse:3
    restart: unless-stopped
    depends_on: *langfuse-depends-on
    ports:
      - '${LANGFUSE_PORT:-3002}:3000'
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: ${LANGFUSE_HOST:?set LANGFUSE_HOST in .env}
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?set LANGFUSE_NEXTAUTH_SECRET in .env}

volumes:
  postgres_data:
  langfuse_db_data:
  clickhouse_data:
  clickhouse_logs:
  minio_data:
